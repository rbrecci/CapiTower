# Gera o APK do MVP Flet na nuvem (o PC local nao tem disco para o Flutter + Android SDK).
# Roda quando algo em flet_mvp/ muda na main ou manualmente em Actions > "Build APK" > Run workflow.
# O APK fica em Actions > run > Artifacts > capitower-apk (zip com o .apk dentro), por 30 dias.
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "flet_mvp/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: flet_mvp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Flet
        run: pip install -r requirements.txt

      - name: Testes do motor de combate
        run: python tests/test_combat.py

      - name: Smoke test da UI
        run: python tests/smoke_ui.py

      - name: flet build apk
        # --yes instala Flutter, JDK e Android SDK sozinho; --no-rich-output deixa o log legivel no CI
        run: flet build apk --yes --no-rich-output -v

      - uses: actions/upload-artifact@v4
        with:
          name: capitower-apk
          path: flet_mvp/build/apk/*.apk
          if-no-files-found: error
          retention-days: 30
